name: Publish dapp to GitHub Pages

on:
  workflow_call:
    inputs:
      destination_dir:
        required: true
        type: string

jobs:
  publish-dapp-to-gh-pages:
    name: Publish dapp to GitHub Pages
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Ensure `destination_dir` is not empty
        if: ${{ inputs.destination_dir == '' }}
        run: exit 1
      - name: Get access token
        id: get-token
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write
        continue-on-error: true
      - name: Checkout and setup environment
        if: ${{ steps.get-token.outcome == 'success' }}
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: true
          persist-credentials: false
      - name: Set snap origin
        run: |
          echo GATSBY_SNAP_ORIGIN=npm:@metamask/${{ github.event.repository.name }}-snap >> .env.production
      - name: Run build script
        run: yarn build
        env:
          GATSBY_PATH_PREFIX: ${{ github.event.repository.name }}/${{ inputs.destination_dir }}/
      - name: Deploy to `${{ inputs.destination_dir }}` directory of `gh-pages` branch
        uses: peaceiris/actions-gh-pages@de7ea6f8efb354206b205ef54722213d99067935
        with:
          # A policy must be registered for this repo and workflow
          # within the Token Exchange Service.
          personal_token: ${{ steps.get-token.outputs.token }}
          publish_dir: ./docs
          destination_dir: ${{ inputs.destination_dir }}
