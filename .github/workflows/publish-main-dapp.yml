name: Publish main branch dapp to GitHub Pages

on:
  push:
    branches: main

jobs:
  publish-to-gh-pages:
    name: Publish dapp to `staging` directory of `gh-pages` branch
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-dapp.yml
    with:
      destination_dir: staging
